<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CELL=2, COLS=120, ROWS=136, X0=-120, Z0=-136, NCELLS=COLS*ROWS;
const STEP=1.2, SEA=0;
const VX=66, VZ=84;

const BIO={OCEAN:0,BEACH:1,GRASS:2,GROVE:3,JUNGLE:4,SWAMP:5,HIGHLAND:6,CONIFER:7,MOUNT:8,DESERT:9,VOLCANO:10};

const H=new Float32Array(NCELLS);
const BOT=new Float32Array(NCELLS);
const WAT=new Float32Array(NCELLS).fill(-1e9);
const BIOA=new Uint8Array(NCELLS);
const VAR=new Float32Array(NCELLS);
const DISTE=new Int16Array(NCELLS).fill(999);
const SLOPE=new Float32Array(NCELLS);
const FLAGS=new Uint8Array(NCELLS);
const LAND=new Uint8Array(NCELLS);

function ihash(ix,iz){
  let n=Math.imul(ix|0,374761393)+Math.imul(iz|0,668265263);
  n=Math.imul(n^(n>>>13),1274126177);
  n=n^(n>>>16);
  return (n>>>0)/4294967296;
}
function vnoise(x,z){
  const ix=Math.floor(x),iz=Math.floor(z);
  let fx=x-ix,fz=z-iz;
  fx=fx*fx*(3-2*fx); fz=fz*fz*(3-2*fz);
  const a=ihash(ix,iz),b=ihash(ix+1,iz),c=ihash(ix,iz+1),d=ihash(ix+1,iz+1);
  return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz;
}
function fbm(x,z,oct){
  let s=0,amp=0.5,f=1;
  for(let i=0;i<oct;i++){ s+=amp*vnoise(x*f,z*f); amp*=0.5; f*=2.03; }
  return s;
}
function ridged(x,z){ const v=fbm(x,z,4); return Math.pow(clamp(Math.abs(1-Math.abs(2*v-1))*2,0,1),1.35); }
function ss(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }
function lerp(a,b,k){ return a+(b-a)*k; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

const SHAPES=[{x:-6,z:-8,rx:88,rz:97},{x:60,z:62,r:46},{x:-60,z:42,r:34}];
function shapeField(x,z,pad){
  let m=-9;
  for(let i=0;i<SHAPES.length;i++){
    const s=SHAPES[i]; let f;
    if(s.r){ const dx=x-s.x,dz=z-s.z,r=s.r+pad; f=1-(dx*dx+dz*dz)/(r*r); }
    else { const dx=(x-s.x)/(s.rx+pad),dz=(z-s.z)/(s.rz+pad); f=1-(dx*dx+dz*dz); }
    if(f>m)m=f;
  }
  return m;
}
function oceanAllowed(x,z){ return z>-26||x<-34; }

const CLEARINGS=[{x:-18,z:-30,r:7},{x:-40,z:-8,r:6},{x:-12,z:0,r:5},{x:-52,z:-22,r:5}];
function inClearing(x,z){
  for(let i=0;i<CLEARINGS.length;i++){
    const c=CLEARINGS[i],dx=x-c.x,dz=z-c.z;
    if(dx*dx+dz*dz<c.r*c.r)return true;
  }
  return false;
}

function bioAtWorld(x,z){
  let bx=x,bz=z;
  const dn=fbm(x*0.05+31,z*0.05+7,2)-0.5;
  bx+=dn*10; bz+=dn*10;
  const vd=Math.hypot(bx-VX,bz-VZ);
  if(vd<28)return BIO.VOLCANO;
  if(bz<-66)return BIO.MOUNT;
  if(bx>=34&&bz>=32)return BIO.DESERT;
  if(bx>=30&&bz>=-50&&bz<-4)return BIO.HIGHLAND;
  if(bx>=26&&bz>=-4&&bz<32)return BIO.GROVE;
  if(bx<-40&&bz>=6&&bz<42)return BIO.SWAMP;
  if(bx<6&&bz>=-46&&bz<10)return BIO.JUNGLE;
  if(bz<-44)return BIO.CONIFER;
  if(bz>=-4)return BIO.GRASS;
  if(bx>=26)return BIO.HIGHLAND;
  return BIO.CONIFER;
}

const SANDSTONE=[{x:78,z:42,r:15,h:30},{x:86,z:58,r:13,h:34},{x:68,z:52,r:11,h:22}];
const HEADLANDS=[{x:-80,z:50,r:4.5,h:6.5},{x:32,z:76,r:4.5,h:5.5}];

function generateFields(){
  for(let gz=0;gz<ROWS;gz++){
    for(let gx=0;gx<COLS;gx++){
      const i=gz*COLS+gx;
      const x=X0+(gx+0.5)*CELL, z=Z0+(gz+0.5)*CELL;
      VAR[i]=fbm(x*0.09+3.7,z*0.09+9.1,3);
      const f=shapeField(x,z,0);
      if(f<=0.045)continue;
      LAND[i]=1;
      const b=bioAtWorld(x,z);
      BIOA[i]=b;
      let h=0;
      if(b===BIO.MOUNT){
        h=30+ridged(x*0.02,z*0.02)*36+(fbm(x*0.06,z*0.06,3)-0.5)*10;
      } else if(b===BIO.CONIFER){
        h=23-((z+66)/22)*6+(fbm(x*0.07,z*0.07,3)-0.5)*6;
      } else if(b===BIO.HIGHLAND){
        const bump=Math.max(0,fbm(x*0.028+40,z*0.028+40,3)-0.55)*24;
        h=21+bump+(fbm(x*0.08,z*0.08,3)-0.5)*6;
      } else if(b===BIO.GROVE){
        h=9+(fbm(x*0.07,z*0.07,3)-0.5)*4.4;
      } else if(b===BIO.JUNGLE){
        h=9+(fbm(x*0.055,z*0.055,3)-0.5)*11;
      } else if(b===BIO.SWAMP){
        h=3.2+(fbm(x*0.09,z*0.09,3)-0.5)*2.8;
      } else if(b===BIO.GRASS){
        h=5.2+(fbm(x*0.06,z*0.06,3)-0.5)*4.4;
      } else if(b===BIO.DESERT){
        h=7+(fbm(x*0.05,z*0.05,3)-0.5)*5.2;
        for(let k=0;k<SANDSTONE.length;k++){
          const m=SANDSTONE[k],dx=x-m.x,dz=z-m.z,d=Math.hypot(dx,dz);
          const kk=Math.max(0,1-d/m.r);
          h+=Math.pow(kk,1.7)*m.h*(0.75+0.5*VAR[i]);
        }
      } else if(b===BIO.VOLCANO){
        const vd=Math.hypot(x-VX,z-VZ);
        h=6+(fbm(x*0.08,z*0.08,3)-0.5)*3;
        if(vd<20){
          if(vd>=7)h=6+Math.pow((20-vd)/13,1.5)*50;
          else h=47+Math.pow(vd/7,2)*9;
        }
      }
      for(let k=0;k<HEADLANDS.length;k++){
        const hl=HEADLANDS[k],dx=x-hl.x,dz=z-hl.z,d=Math.hypot(dx,dz);
        const kk=Math.max(0,1-d/hl.r);
        if(kk>0)h=Math.max(h,2+kk*hl.h);
      }
      H[i]=h;
    }
  }
  const distQueue=new Int32Array(NCELLS);
  let qh=0,qt=0;
  for(let gz=0;gz<ROWS;gz++)for(let gx=0;gx<COLS;gx++){
    const i=gz*COLS+gx;
    if(!LAND[i])continue;
    let edge=false;
    if(gx===0||gx===COLS-1||gz===0||gz===ROWS-1)edge=true;
    else{
      if(!LAND[i-1]||!LAND[i+1]||!LAND[i-COLS]||!LAND[i+COLS])edge=true;
    }
    if(edge){ DISTE[i]=1; distQueue[qt++]=i; }
  }
  while(qh<qt){
    const i=distQueue[qh++],d=DISTE[i];
    const gx=i%COLS,gz=(i/COLS)|0;
    if(gx>0&&LAND[i-1]&&DISTE[i-1]>d+1){DISTE[i-1]=d+1;distQueue[qt++]=i-1;}
    if(gx<COLS-1&&LAND[i+1]&&DISTE[i+1]>d+1){DISTE[i+1]=d+1;distQueue[qt++]=i+1;}
    if(gz>0&&LAND[i-COLS]&&DISTE[i-COLS]>d+1){DISTE[i-COLS]=d+1;distQueue[qt++]=i-COLS;}
    if(gz<ROWS-1&&LAND[i+COLS]&&DISTE[i+COLS]>d+1){DISTE[i+COLS]=d+1;distQueue[qt++]=i+COLS;}
  }
  for(let gz=0;gz<ROWS;gz++)for(let gx=0;gx<COLS;gx++){
    const i=gz*COLS+gx;
    if(!LAND[i])continue;
    const x=X0+(gx+0.5)*CELL, z=Z0+(gz+0.5)*CELL;
    const fade=1-ss(1,5,DISTE[i]);
    H[i]=lerp(H[i],Math.max(4,H[i]*0.32),fade*0.9);
    const warm=(BIOA[i]===BIO.GRASS||BIOA[i]===BIO.GROVE||BIOA[i]===BIO.JUNGLE||BIOA[i]===BIO.SWAMP||BIOA[i]===BIO.DESERT);
    if(warm&&DISTE[i]<=2){
      H[i]=Math.min(H[i],1.4+DISTE[i]*0.55+VAR[i]*1.2);
      if(BIOA[i]!==BIO.SWAMP&&BIOA[i]!==BIO.DESERT)BIOA[i]=BIO.BEACH;
    }
  }
  const HC=Float32Array.from(H);
  for(let pass=0;pass<3;pass++){
    const src=Float32Array.from(HC);
    for(let gz=1;gz<ROWS-1;gz++)for(let gx=1;gx<COLS-1;gx++){
      const i=gz*COLS+gx;
      if(!LAND[i])continue;
      let s=src[i]*2,cnt=2;
      for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
        if(dx===0&&dz===0)continue;
        const j=i+dz*COLS+dx;
        if(LAND[j]){s+=src[j];cnt++;}
      }
      HC[i]=s/cnt;
    }
  }
  H.set(HC);
  for(let i=0;i<NCELLS;i++)if(LAND[i])H[i]=Math.round(H[i]/STEP)*STEP;
  for(let i=0;i<NCELLS;i++){
    if(!LAND[i])continue;
    BOT[i]=-(10+58*Math.pow(Math.min(1,DISTE[i]/26),0.72))+(fbm((i%COLS)*0.3,(i/COLS)*0.3,2)-0.5)*7;
  }
  const landQ=new Int32Array(NCELLS);let lh=0,lt=0;
  for(let i=0;i<NCELLS;i++)if(LAND[i]){landQ[lt++]=i;}
  const DIL=new Int16Array(NCELLS).fill(999);
  for(let k=0;k<lt;k++)DIL[landQ[k]]=0;
  let cur=0;
  while(lh<lt){
    const i=landQ[lh++];cur=DIL[i];
    const gx=i%COLS,gz=(i/COLS)|0;
    const nb=[gx>0?i-1:-1,gx<COLS-1?i+1:-1,gz>0?i-COLS:-1,gz<ROWS-1?i+COLS:-1];
    for(let k2=0;k2<4;k2++){
      const j=nb[k2];
      if(j>=0&&!LAND[j]&&DIL[j]>cur+1){DIL[j]=cur+1;landQ[lt++]=j;}
    }
  }
  for(let i=0;i<NCELLS;i++)if(DIL[i]<999)WATDIL[i]=DIL[i];
}
const WATDIL=new Int16Array(NCELLS).fill(999);

function gridIdx(x,z){
  const gx=Math.floor((x-X0)/CELL),gz=Math.floor((z-Z0)/CELL);
  if(gx<0||gx>=COLS||gz<0||gz>=ROWS)return -1;
  return gz*COLS+gx;
}
function groundY(x,z){
  const i=gridIdx(x,z);
  if(i<0||!LAND[i]){
    for(let r=1;r<=3;r++){
      for(const o of [[r,0],[-r,0],[0,r],[0,-r]]){
        const j=gridIdx(x+o[0]*CELL,z+o[1]*CELL);
        if(j>=0&&LAND[j])return H[j];
      }
    }
    return 2;
  }
  return H[i];
}
function waterAt(x,z){
  const i=gridIdx(x,z);
  return i>=0&&WAT[i]>-1e8;
}

const FALLS=[];
const MOUTHS=[];
let lastFallMark=-99;
function stampRiver(pts,opt){
  opt=opt||{};
  const w=opt.w||1.15;
  for(let s=0;s<pts.length-1;s++){
    const a=pts[s],b=pts[s+1];
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const steps=Math.max(2,Math.ceil(len/(CELL*0.5)));
    for(let k=0;k<=steps;k++){
      const tt=k/steps;
      const x=lerp(a[0],b[0],tt), z=lerp(a[1],b[1],tt);
      let bed=lerp(a[2],b[2],tt);
      bed=Math.round(bed/STEP)*STEP;
      if(s===pts.length-2&&k===steps&&opt.mouth)MOUTHS.push([x,z]);
      const gx=Math.floor((x-X0)/CELL),gz=Math.floor((z-Z0)/CELL);
      const rad=Math.ceil(w);
      for(let dz=-rad;dz<=rad;dz++)for(let dx=-rad;dx<=rad;dx++){
        if(dx*dx+dz*dz>w*w+0.35)continue;
        const j=gz+dz,jx=gx+dx;
        if(jx<1||jx>=COLS-1||j<1||j>=ROWS-1)continue;
        const ii=j*COLS+jx;
        if(!LAND[ii])continue;
        if(H[ii]>bed)H[ii]=bed;
        let wv=bed+(opt.type==='swamp'?0.85:0.75);
        if(wv<H[ii]+0.3)wv=H[ii]+0.3;
        if(WAT[ii]<-1e8||wv<WAT[ii]){
          WAT[ii]=wv;
          WTYPE[ii]=opt.type==='swamp'?4:1;
        }
      }
      if(s>0){
        const drop=pts[s-1][2]-pts[s][2];
        if(drop>2.1&&(s*100+k)-lastFallMark>4){
          lastFallMark=s*100+k;
          const dxn=(b[0]-a[0])/len,dzn=(b[1]-a[1])/len;
          FALLS.push({x:x,z:z,nx:dxn,nz:dzn,w:w*CELL*1.7,top:Math.round(pts[s-1][2]/STEP)*STEP+0.78,h:drop+1.8});
        }
      }
    }
  }
}
const WTYPE=new Uint8Array(NCELLS);

const RIVER_MAIN=[[-14,-84,44],[-13,-70,26],[-10,-56,19],[-7,-45,15],[-8.5,-41.5,11.2],[-12,-34,10.6],[-4,-24,10],[-14,-14,9],[-8,-2,8],[-2,8,7],[4,20,6],[6,34,5.4]];
const DELTA1=[[6,34,5.4],[1,52,4.6],[-3,68,3.4],[-6,80,2.2],[-7,88,0.2]];
const DELTA2=[[6,34,5.4],[10,52,4.6],[14,70,3.4],[16,82,2.2],[17,89,0.2]];
const DELTA3=[[6,34,5.4],[13,46,4.8],[21,60,4],[27,74,3],[30,84,1.6],[31,89,0.2]];
const RIVER_HIGH=[[46,-40,19],[36,-32,16.5],[26,-26,14],[16,-23,12],[6,-23,11],[0,-24,10.2]];
const RIVER_MELT2=[[-2,-80,42],[2,-64,24],[0,-50,17],[4,-38,13.5],[1,-30,11],[-3,-25,10.2]];
const STREAM_GROVE=[[44,-6,15],[42,2,12],[40,10,10],[39,15,9],[38.5,17.5,8.4]];
const STREAM_GROVE2=[[56,4,12],[50,11,10.5],[44,16,9.4],[39.5,18,8.4]];
const LINK_JUNGLE=[[-30,-16,8.2],[-24,-19,8.8],[-16,-22,9.4],[-9,-23,9.8],[-4,-24,10]];
const CHANNEL_SWAMP=[[-34,-2,7.6],[-44,4,6.6],[-54,10,5.6],[-60,16,5],[-66,24,4.4],[-76,30,3.4],[-86,34,2.2],[-95,36.5,0.4]];
const WASH1=[[72,40,9],[64,46,8],[57,51,7.5],[51,55,7.2]];
const WASH2=[[84,58,9],[77,63,8.4],[71,67,8]];

const PONDS=[
 {x:-30,z:-16,r:5.5,bed:7.6,type:1},
 {x:-44,z:-30,r:4,bed:9.2,type:1},
 {x:38,z:19,r:5,bed:7.8,type:1},
 {x:58,z:-20,r:4,bed:18.6,type:1},
 {x:-16,z:42,r:3.5,bed:4.2,type:1},
 {x:20,z:22,r:3,bed:4.6,type:1},
 {x:-58,z:14,r:4,bed:2.1,type:4},
 {x:-67,z:21,r:4.5,bed:2.1,type:4},
 {x:-56,z:27,r:3.5,bed:2.1,type:4},
 {x:-70,z:29,r:4,bed:2.1,type:4},
 {x:-62,z:35,r:3.5,bed:2.1,type:4}
];

const LAVA_FLOW_A=[[61,79],[57,74],[53,69],[50,66]];
const LAVA_FLOW_B=[[72,89],[77,93],[82,97],[87,101],[90,103]];
const LAVA_POOLS=[{x:50.5,z:67,r:3,y:21.5}];
const OBSIDIAN=[[89.2,102.2],[90.2,103],[91,103.8],[89.8,103.4]];

function carveHydro(){
  stampRiver(RIVER_MAIN,{});
  stampRiver(DELTA1,{w:1.5,mouth:true});
  stampRiver(DELTA2,{w:1.5,mouth:true});
  stampRiver(DELTA3,{w:1.5,mouth:true});
  stampRiver(RIVER_HIGH,{});
  stampRiver(RIVER_MELT2,{});
  stampRiver(STREAM_GROVE,{w:0.85});
  stampRiver(STREAM_GROVE2,{w:0.85});
  stampRiver(LINK_JUNGLE,{w:0.95});
  stampRiver(CHANNEL_SWAMP,{type:'swamp',w:1.1,mouth:true});
  for(let p=0;p<PONDS.length;p++){
    const pd=PONDS[p];
    const bed=Math.round(pd.bed/STEP)*STEP;
    const gx=Math.floor((pd.x-X0)/CELL),gz=Math.floor((pd.z-Z0)/CELL),rad=Math.ceil(pd.r);
    for(let dz=-rad;dz<=rad;dz++)for(let dx=-rad;dx<=rad;dx++){
      const d2=dx*dx+dz*dz;
      if(d2>pd.r*pd.r)continue;
      const jx=gx+dx,j=gz+dz;
      if(jx<1||jx>=COLS-1||j<1||j>=ROWS-1)continue;
      const i=j*COLS+jx;
      if(!LAND[i])continue;
      H[i]=bed;
      WAT[i]=bed+0.75;
      WTYPE[i]=pd.type;
    }
  }
  for(let i=0;i<NCELLS;i++){
    if(!LAND[i])continue;
    if(BIOA[i]===BIO.SWAMP&&H[i]<3.6&&WAT[i]<-1e8){
      WAT[i]=2.8;WTYPE[i]=4;
    }
  }
  function stampWash(pts){
    for(let s=0;s<pts.length-1;s++){
      const a=pts[s],b=pts[s+1];
      const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const steps=Math.max(2,Math.ceil(len/(CELL*0.5)));
      for(let k=0;k<=steps;k++){
        const tt=k/steps;
        const x=lerp(a[0],b[0],tt),z=lerp(a[1],b[1],tt);
        const fade=tt;
        const bed=Math.round(lerp(a[2],b[2],tt)/STEP)*STEP;
        const gx=Math.floor((x-X0)/CELL),gz=Math.floor((z-Z0)/CELL);
        for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
          if(dx*dx+dz*dz>1.4)continue;
          const i=(gz+dz)*COLS+gx+dx;
          if(i<0||i>=NCELLS||!LAND[i])continue;
          if(Math.random()<fade){
            H[i]=Math.min(H[i]+ (H[i]-bed)*0 ,bed);
            FLAGS[i]|=1;
          }
        }
      }
    }
  }
  stampWash(WASH1);
  stampWash(WASH2);
  for(let c=0;c<CLEARINGS.length;c++){
    const cl=CLEARINGS[c];
    const gx=Math.floor((cl.x-X0)/CELL),gz=Math.floor((cl.z-Z0)/CELL);
    for(let dz=-cl.r;dz<=cl.r;dz++)for(let dx=-cl.r;dx<=cl.r;dx++){
      if(dx*dx+dz*dz>cl.r*cl.r)continue;
      const i=(gz+dz)*COLS+gx+dx;
      if(i<0||i>=NCELLS||!LAND[i])continue;
      FLAGS[i]|=2;
    }
  }
  stampLavaFlow(LAVA_FLOW_A,52,20);
  stampLavaFlow(LAVA_FLOW_B,52,4);
  for(let p=0;p<LAVA_POOLS.length;p++){
    const pl=LAVA_POOLS[p];
    const gx=Math.floor((pl.x-X0)/CELL),gz=Math.floor((pl.z-Z0)/CELL),rad=Math.ceil(pl.r);
    for(let dz=-rad;dz<=rad;dz++)for(let dx=-rad;dx<=rad;dx++){
      if(dx*dx+dz*dz>pl.r*pl.r)continue;
      const i=(gz+dz)*COLS+gx+dx;
      if(i<0||i>=NCELLS||!LAND[i])continue;
      H[i]=Math.round(pl.y/STEP)*STEP-STEP;
      BIOA[i]=BIO.VOLCANO;
      LAVACELLS.push({i,y:pl.y});
    }
  }
  for(let i=0;i<NCELLS;i++){
    if(!LAND[i]||BIOA[i]!==BIO.VOLCANO)continue;
    const x=X0+(i%COLS+0.5)*CELL,z=Z0+(((i/COLS)|0)+0.5)*CELL;
    const vd=Math.hypot(x-VX,z-VZ);

  }
}

function stampLavaFlow(pts,topY,endY){
  for(let s=0;s<pts.length-1;s++){
    const a=pts[s],b=pts[s+1];
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const steps=Math.max(2,Math.ceil(len/(CELL*0.5)));
    for(let k=0;k<=steps;k++){
      const tt=k/steps;
      const x=lerp(a[0],b[0],tt),z=lerp(a[1],b[1],tt);
      const bed=lerp(topY,endY,tt);
      const gx=Math.floor((x-X0)/CELL),gz=Math.floor((z-Z0)/CELL);
      for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
        if(dx*dx+dz*dz>1.4)continue;
        const i=(gz+dz)*COLS+gx+dx;
        if(i<0||i>=NCELLS||!LAND[i])continue;
        BIOA[i]=BIO.VOLCANO;
        if(dx===0&&dz===0){
          const qb=Math.round(bed/STEP)*STEP;
          if(H[i]>qb)H[i]=qb;
          FLOWCELLS.push({i,y:qb+0.4});

      }
    }
  }
}

function buildOceanAndRim(){

    if(shapeField(x,z,15)>0.045&&oceanAllowed(x,z)){

    }
  }
  const ISLETS=[{x:0,z:92,r:2.4},{x:14,z:91,r:2},{x:27,z:90,r:2}];
  for(let k=0;k<ISLETS.length;k++){
    const is=ISLETS[k];
    const gx=Math.floor((is.x-X0)/CELL),gz=Math.floor((is.z-Z0)/CELL),rad=Math.ceil(is.r)+1;
    for(let dz=-rad;dz<=rad;dz++)for(let dx=-rad;dx<=rad;dx++){
      const i=(gz+dz)*COLS+gx+dx;
      if(i<0||i>=NCELLS)continue;
      const d=Math.sqrt(dx*dx+dz*dz);
      if(d<=is.r){
        LAND[i]=1;WAT[i]=-1e9;H[i]=1.8;BIOA[i]=BIO.BEACH;
        BOT[i]=-(12+ihash(dx+9,dz+7)*10);
      }
    }
  }
  const REEFS=[{x:-72,z:78,r:3},{x:28,z:97,r:3.4},{x:-30,z:95,r:3}];
  for(let k=0;k<REEFS.length;k++)REEFCENTERS.push(REEFS[k]);
  for(let gz=1;gz<ROWS-1;gz++)for(let gx=1;gx<COLS-1;gx++){
    const i=gz*COLS+gx;

    const cand=[
      [gx>0?i-1:-1,[-1,0]],[gx<COLS-1?i+1:-1,[1,0]],
      [gz>0?i-COLS:-1,[0,-1]],[gz<ROWS-1?i+COLS:-1,[0,1]]

function boxTo(arr,x,y,z,sx,sy,sz,color,jit){

  const x0=x-sx/2,x1=x+sx/2,z0=z-sz/2,z1=z+sz/2,y0=y,y1=y+sy;
  const ct=c.clone().multiplyScalar(1.0),cs=c.clone().multiplyScalar(0.78),cb=c.clone().multiplyScalar(0.55);
  quadI(arr,pv(arr,x0,y1,z0,ct),pv(arr,x0,y1,z1,ct),pv(arr,x1,y1,z1,ct),pv(arr,x1,y1,z0,ct));
  quadI(arr,pv(arr,x0,y0,z0,cb),pv(arr,x1,y0,z0,cb),pv(arr,x1,y0,z1,cb),pv(arr,x0,y0,z1,cb));
  quadI(arr,pv(arr,x0,y0,z1,cs),pv(arr,x1,y0,z1,cs),pv(arr,x1,y1,z1,cs),pv(arr,x0,y1,z1,cs));
  quadI(arr,pv(arr,x1,y0,z0,cs),pv(arr,x0,y0,z0,cs),pv(arr,x0,y1,z0,cs),pv(arr,x1,y1,z0,cs));

  quadI(arr,pv(arr,x0,y0,z0,cs),pv(arr,x0,y0,z1,cs),pv(arr,x0,y1,z1,cs),pv(arr,x0,y1,z0,cs));

function topColor(i,gx,gz,out){
  const b=BIOA[i],h=H[i],v=VAR[i],de=DISTE[i],sl=SLOPE[i];
  const r=ihash(gx*7+1,gz*7+3);
  const flags=FLAGS[i];
  const x=X0+(gx+0.5)*CELL,z=Z0+(gz+0.5)*CELL;
  const warm=(b===BIO.BEACH||(de<=2&&(b===BIO.GRASS||b===BIO.GROVE||b===BIO.JUNGLE||b===BIO.SWAMP||b===BIO.DESERT)));
  if(sl>STEP*1.8&&!(b===BIO.CONIFER&&h>18&&v>0.5)){
    cliffColor(b,h,out);
    out.multiplyScalar(0.92+v*0.12);
    return out;
  }
  if(b===BIO.MOUNT){
    const snowLine=38+v*8;
    if(h>snowLine)out.set(0xf4f8fc).multiplyScalar(0.94+r*0.06);
    else if(h>snowLine-6)out.set(0xd8e2ec);
    else out.set(0x5d6878).lerp(cTmp2.set(0x767f8e),v).multiplyScalar(0.92+r*0.12);
  } else if(b===BIO.CONIFER){
    if(v<0.16)out.set(0x8a93a2);
    else out.set(0xecf2f7).multiplyScalar(0.93+r*0.07);
  } else if(b===BIO.HIGHLAND){
    if(v>0.66)out.set(0x8a919a);
    else if(v<0.2)out.set(0x6f8266);
    else out.set(0x7f9070).lerp(cTmp2.set(0x8d9c7c),v).multiplyScalar(0.93+r*0.1);
  } else if(b===BIO.GROVE){
    out.set(0xb9d0a4).lerp(cTmp2.set(0xdfb3cf),clamp((v-0.3)*1.8,0,1)).multiplyScalar(0.94+r*0.09);
    if(r<0.13)out.lerp(cTmp2.set(0xf4c2dd),0.65);
  } else if(b===BIO.JUNGLE){
    if(flags&2)out.set(0x7d8a83).multiplyScalar(0.92+r*0.12);
    else out.set(0x3c7a40).lerp(cTmp2.set(0x2f6b38),v).multiplyScalar(0.92+r*0.13);
  } else if(b===BIO.SWAMP){
    if(de<=2)out.set(0x7a7f55);
    else out.set(0x5a6b38).lerp(cTmp2.set(0x4c5c30),v).multiplyScalar(0.93+r*0.1);
  } else if(b===BIO.DESERT){
    if(flags&1)out.set(0xb98c48);
    else if(h>14){const band=Math.floor(h/2.4)&1;out.set(band?0xc08a4c:0xa8713c).multiplyScalar(0.95+r*0.08);}
    else out.set(0xe2bd74).lerp(cTmp2.set(0xcf9f56),v).multiplyScalar(0.94+r*0.09);
  } else if(b===BIO.VOLCANO){
    const vd=Math.hypot(x-VX,z-VZ);
    if(vd<13)out.set(0x4a4c50);
    else out.set(0x262a30).lerp(cTmp2.set(0x30353c),v).multiplyScalar(0.95+r*0.1);
  } else if(b===BIO.BEACH||warm&&de<=2){
    if(de<=0){out.set(0xd8c9a0);}
    else out.set(0xeee3c2).lerp(cTmp2.set(0xf4ecd6),v).multiplyScalar(0.95+r*0.06);
  } else {
    out.set(0x74b054).lerp(cTmp2.set(0x86a24f),v);
    if(v>0.72)out.lerp(cTmp2.set(0x9aa653),0.6);
    out.multiplyScalar(0.93+r*0.1);
    if(r<0.045)out.set(0xf0e04e);
    else if(r<0.075)out.set(0xf6f6ee);
    else if(r<0.09)out.set(0xe79ac6);
  }
  return out;
}

function buildTerrain(){
  const c=new THREE.Color();
  for(let gz=0;gz<ROWS;gz++)for(let gx=0;gx<COLS;gx++){
    const i=gz*COLS+gx;
    if(!LAND[i])continue;
    const x0=X0+gx*CELL,x1=x0+CELL,z0=Z0+gz*CELL,z1=z0+CELL;
    const h=H[i],bd=BOT[i];
    topColor(i,gx,gz,c);
    quadI(terr,pv(terr,x0,h,z0,c),pv(terr,x0,h,z1,c),pv(terr,x1,h,z1,c),pv(terr,x1,h,z0,c));
    skirtColor(bd,c);
    quadI(terr,pv(terr,x0,bd,z0,c),pv(terr,x1,bd,z0,c),pv(terr,x1,bd,z1,c),pv(terr,x0,bd,z1,c));
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let d=0;d<4;d++){
      const nx=gx+dirs[d][0],nz=gz+dirs[d][1];
      const horiz=dirs[d][1]===0;
      const nrmX=horiz?dirs[d][0]:0;
      const nrmZ=horiz?0:dirs[d][1];
      const spanA=horiz?z0:x0;
      const spanB=horiz?z1:x1;
      const plane=dirs[d][0]>0?x1:(dirs[d][0]<0?x0:(dirs[d][1]>0?z1:z0));
      if(nx<0||nx>=COLS||nz<0||nz>=ROWS||!LAND[nz*COLS+nx]){
        skirtColor(bd,c).multiplyScalar(1.05);
        emitWall(nrmX,nrmZ,spanA,spanB,plane,h,bd,c,true);
        continue;
      }
      const ni=nz*COLS+nx;
      if(H[ni]<h-0.01){
        const drop=h-H[ni];
        if(drop>STEP*1.8){cliffColor(BIOA[i],h,c).multiplyScalar(0.85);}
        else{topColor(i,gx,gz,c).multiplyScalar(0.72);}
        emitWall(nrmX,nrmZ,spanA,spanB,plane,h,H[ni],c,false);
      }
      if(BOT[ni]<bd-0.01){
        skirtColor(BOT[ni],c);
        emitWall(-nrmX,-nrmZ,spanA,spanB,plane,bd,BOT[ni],c,true);
      }
    }
  }
}
function emitWall(dirX,dirZ,spanA,spanB,plane,ya,yb,c,gradient){
  let cTop=c,cBot=c;
  if(gradient){cBot=cTmp2.copy(c).multiplyScalar(0.72);}
  const yT=ya,yB=yb;
  let a,b,c2,d;
  if(dirZ>0){
    a=pv(terr,spanA,yB,plane,cBot);b=pv(terr,spanB,yB,plane,cBot);c2=pv(terr,spanB,yT,plane,cTop);d=pv(terr,spanA,yT,plane,cTop);
  } else if(dirZ<0){
    a=pv(terr,spanB,yB,plane,cBot);b=pv(terr,spanA,yB,plane,cBot);c2=pv(terr,spanA,yT,plane,cTop);d=pv(terr,spanB,yT,plane,cTop);
  } else if(dirX>0){
    a=pv(terr,plane,yB,spanB,cBot);b=pv(terr,plane,yB,spanA,cBot);c2=pv(terr,plane,yT,spanA,cTop);d=pv(terr,plane,yT,spanB,cTop);
  } else {
    a=pv(terr,plane,yB,spanA,cBot);b=pv(terr,plane,yB,spanB,cBot);c2=pv(terr,plane,yT,spanB,cTop);d=pv(terr,plane,yT,spanA,cTop);
  }
  quad(terr,a,b,c2,d);
}

function waterColor(i,gx,gz,out){
  const wt=WTYPE[i];
  if(wt===3){
    const dl=WATDIL[i];
    const x=X0+(gx+0.5)*CELL,z=Z0+(gz+0.5)*CELL;
    if(dl<=2)out.set(0x3ed6cf);
    else if(dl<=5)out.set(0x23aac6);
    else if(dl<=10)out.set(0x1673a8);
    else out.set(0x0d4a7e);
    let md=1e9;
    for(let k=0;k<MOUTHS.length;k++){
      const d=Math.hypot(x-MOUTHS[k][0],z-MOUTHS[k][1]);
      if(d<md)md=d;
    }
    if(md<10)out.lerp(cTmp2.set(0x7fdcd0),(1-md/10)*0.8);
    if(md<5)out.lerp(cTmp2.set(0xcdb87f),(1-md/5)*0.5);
    for(let k=0;k<REEFCENTERS.length;k++){
      const rf=REEFCENTERS[k];
      const d=Math.hypot(x-rf.x,z-rf.z);
      if(d<rf.r)out.lerp(cTmp2.set(0x43ded2),0.7);
    }
  } else if(wt===4)out.set(0x4f6030);
  else if(wt===1)out.set(0x35c8e8);
  else out.set(0x3ecfdd);
  return out;
}

function scatter(n,xa,xb,za,zb,minSep,test,fn){
  const placed=[];
  let tries=n*30;
  while(n>0&&tries-->0){
    const x=xa+Math.random()*(xb-xa),z=za+Math.random()*(zb-za);
    if(!test(x,z))continue;
    let ok=true;
    for(let k=0;k<placed.length;k++){
      const dx=placed[k][0]-x,dz=placed[k][1]-z;
      if(dx*dx+dz*dz<minSep*minSep){ok=false;break;}
    }
    if(!ok)continue;
    placed.push([x,z]);
    fn(x,z);
    n--;
  }
}

function seasonState(t){
  const u=t/SEASON_LEN;
  const i=Math.floor(u)%4,j=(i+1)%4;
  const f=u-Math.floor(u);
  const k=f<0.85?0:ss(0.85,1,f);
  const A=SEASONS[i],B=SEASONS[j];
  const out={
    name:A.name,
    rain:lerp(A.rain,B.rain,k),
    snow:lerp(A.snow,B.snow,k),
    dust:lerp(A.dust,B.dust,k),
    bliz:lerp(A.bliz,B.bliz,k),
    mist:lerp(A.mist,B.mist,k)
  };
  out.tint=A.tint.clone().lerp(B.tint,k);
  return out;
}

function updateSun(t){
  const th=t/DAY_LEN*Math.PI*2+0.35;
  const alt=Math.sin(th);
  sunMesh.position.set(Math.cos(th)*300,alt*260,-90);
  sunMesh.visible=alt>-0.15;
  const daylight=ss(-0.08,0.25,alt);
  const seas=seasonState(t);
  sun.position.set(Math.cos(th)*320,Math.max(alt,-0.1)*280,-95);
  sun.intensity=daylight*2.3;
  const duskK=Math.pow(1-clamp(alt,0,1),2)*0.7;
  sun.color.copy(seas.tint).lerp(cTmp.set(0xff9a4a),duskK);
  hemi.intensity=0.18+daylight*0.5;
  hemi.color.copy(cTmp.set(0x16203a)).lerp(cTmp2.set(0xbcd8ea),daylight);
  amb.intensity=0.12+daylight*0.15;
  sun.castShadow=daylight>0.03;
  let phase;
  if(alt<-0.1)phase='NIGHT';
  else if(alt<0.18)phase=Math.cos(th)>0?'DAWN':'DUSK';
  else phase=Math.cos(th)>0?'MORNING':'AFTERNOON';
  return {seas,daylight,alt,phase};
}

function updateZones(t,dt,seas,daylight,alt,cosTh){
  for(let zi=0;zi<zones.length;zi++){
    const z=zones[zi];
    let mul=1;
    if(z.mul==='rain')mul=seas.rain;
    else if(z.mul==='snow')mul=seas.snow;
    else if(z.mul==='dust')mul=seas.dust;
    else if(z.mul==='bliz')mul=seas.bliz;
    else if(z.mul==='mist')mul=seas.mist;
    let e=env(t,z.period,z.duty,z.phase)*mul;
    if(z.morning)e*=ss(0.02,0.2,alt)*(cosTh>0?1:0.25);
    const a=z.arr;
    const wind=z.wind||{x:0,y:0,z:0};
    for(let k=0;k<z.count;k++){
      const k3=k*3;
      if(z.kind==='rain'||z.kind==='snow'){
        a[k3]+=wind.x*dt;a[k3+1]+=wind.y*dt;a[k3+2]+=wind.z*dt;
        if(z.kind==='snow')a[k3]+=Math.sin(t*2+k)*dt*1.4;
        if(a[k3+1]<z.yMin-1)spawnIn(z,k);
      } else if(z.kind==='blizzard'){
        a[k3]+=wind.x*dt;a[k3+1]+=wind.y*dt;a[k3+2]+=wind.z*dt;
        if(a[k3+2]>z.cz+55||a[k3+1]<26)spawnIn(z,k);
      } else if(z.kind==='dust'){
        a[k3]+=wind.x*dt;a[k3+1]+=wind.y*dt;a[k3+2]+=wind.z*dt;
        if(a[k3]>z.cx+z.r){spawnIn(z,k);a[k3]=z.cx-z.r+1;}
      } else if(z.kind==='ash'){
        a[k3]+=wind.x*dt;a[k3+1]+=(wind.y+z.jit[k]*4)*dt;a[k3+2]+=wind.z*dt;
        if(a[k3+1]>86)spawnIn(z,k);
      } else if(z.kind==='steam'){
        a[k3+1]+=wind.y*dt;
        if(a[k3+1]>10)spawnIn(z,k);
      } else if(z.kind==='mist'){
        a[k3]+=Math.sin(t*0.3+k)*dt*1.2;
        a[k3+1]+=Math.sin(t*0.5+k*2)*dt*0.3;
        a[k3+2]+=Math.cos(t*0.25+k)*dt*0.8;
        const dx=a[k3]-z.cx,dz=a[k3+2]-z.cz;
        if(dx*dx+dz*dz>z.r*z.r)spawnIn(z,k);
      }
    }
    z.t.geo.attributes.position.needsUpdate=true;
    z.t.mat.opacity=e*z.base;
    if(z.deckG){
      z.deckG.children.forEach(b=>{
        b.position.x+=(z.kind==='dust'?4:1.2)*dt;
        if(b.position.x>z.cx+z.r*1.4)b.position.x=z.cx-z.r*1.4;
      });
      z.deckM.opacity=(z.deckFloor||0)+e*0.5;
    }
    if(z.sheetPs){
      for(let s=0;s<z.sheetPs.length;s++){
        const sp=z.sheetPs[s];
        if(z.sheets.axis==='z'){
          if(sp.position.z===0||sp.position.z>z.cz+45){
            sp.position.set(z.cx+(Math.random()-0.5)*2*z.hx,0,z.cz-45);
            sp.position.y=(z.yMin+Math.random()*(z.yMax-z.yMin));
          }
          sp.position.z+=30*dt;
        } else {
          if(sp.position.x===0||sp.position.x>z.cx+z.r){
            sp.position.set(z.cx-z.r,0,z.cz+(Math.random()-0.5)*z.r);
            sp.position.y=(z.yMin+Math.random()*(z.yMax-z.yMin));
          }
          sp.position.x+=18*dt;
        }
        z.sheetMs[s].opacity=e*0.28;
      }
    }
  }
  const ee=env(t,120,0.85,0.3)*daylight*lerp(0.7,1.4,(seas.dust-0.7)/0.55);
  for(let k=0;k<260;k++){
    const zn=evapZones[evapZoneIdx[k]];
    const k3=k*3;
    evap.arr[k3+1]+=2.2*dt;
    if(evap.arr[k3+1]-evapBase[k]>9||evap.arr[k3+1]===0){
      const rr=Math.sqrt(Math.random())*zn[2],an=Math.random()*Math.PI*2;
      evap.arr[k3]=zn[0]+Math.cos(an)*rr;
      evap.arr[k3+2]=zn[1]+Math.sin(an)*rr;
      const gy=Math.max(groundY(evap.arr[k3],evap.arr[k3+2]),0);
      evap.arr[k3+1]=gy+0.4;
      evapBase[k]=gy+0.4;
    }
  }
  evap.geo.attributes.position.needsUpdate=true;
  evap.mat.opacity=ee*0.5;
}

function spikeFn(t){
  const ph=(t/ERUPT_P)%1;
  if(ph>0.45)return 0;
  return Math.pow(Math.sin(ph/0.45*Math.PI),2);
}
function updateVolcano(t,dt){
  lavaMat.color.setScalar(0.9+0.14*Math.sin(t*2.6));
  const sp=spikeFn(t);
  craterLight.intensity=(120+sp*380)*(0.85+0.3*Math.sin(t*11));
  poolLight.intensity=50+15*Math.sin(t*3.1);
  const cyc=Math.floor(t/ERUPT_P);
  if(cyc!==lastCyc){
    lastCyc=cyc;
    for(let k=0;k<bombs.length;k++){
      const b=bombs[k];
      b.alive=true;b.m.visible=true;
      b.m.position.set(VX,53,VZ);
      b.v.set((Math.random()-0.5)*16,26+Math.random()*14,(Math.random()-0.5)*16);
    }
  }
  for(let k=0;k<bombs.length;k++){
    const b=bombs[k];
    if(!b.alive)continue;
    b.v.y-=30*dt;
    b.m.position.addScaledVector(b.v,dt);
    b.m.rotation.x+=dt*4;b.m.rotation.z+=dt*3;
    if(b.m.position.y<groundY(b.m.position.x,b.m.position.z)-2){b.alive=false;b.m.visible=false;}
  }
}

function updateAnimals(t,dt){
  for(let k=0;k<animals.length;k++){
    const a=animals[k];
    a.timer-=dt;
    if(a.timer<=0){
      a.timer=1.5+Math.random()*3.5;
      const toHomeX=a.home[0]-a.g.position.x,toHomeZ=a.home[1]-a.g.position.z;
      const dh=Math.atan2(toHomeX,toHomeZ);
      const dd=Math.hypot(toHomeX,toHomeZ);
      if(dd>a.radius)a.heading=dh+(Math.random()-0.5);
      else a.heading+=(Math.random()-0.5)*2.2;
    }
    const nx=a.g.position.x+Math.sin(a.heading)*a.speed*dt;
    const nz=a.g.position.z+Math.cos(a.heading)*a.speed*dt;
    if(!a.aquatic&&waterAt(nx,nz)){a.heading+=Math.PI*(0.6+Math.random()*0.8);continue;}
    const hd=Math.hypot(nx-a.home[0],nz-a.home[1]);
    if(hd>a.radius*1.15){a.heading+=Math.PI*0.9;continue;}
    a.g.position.x=nx;a.g.position.z=nz;
    let gy=a.aquatic?a.fixedY:groundY(nx,nz);
    if(a.hop){
      a.phase+=dt*a.speed*3;
      gy+=Math.abs(Math.sin(a.phase))*0.5;
    } else {
      a.phase+=dt*a.speed*2.4;
      gy+=Math.abs(Math.sin(a.phase*0.5))*0.08;
    }
    a.g.position.y=gy;
    a.g.rotation.y=a.heading;
    for(let l=0;l<a.legs.length;l++){
      a.legs[l].rotation.x=Math.sin(a.phase+l*Math.PI)*0.55;
    }
    if(a.crab)a.g.rotation.y=a.heading+Math.PI/2;
  }
  for(let k=0;k<seals.length;k++){
    seals[k].g.rotation.y=Math.sin(t*0.2+seals[k].ph)*0.8;
  }
  for(let k=0;k<birds.length;k++){
    const b=birds[k];
    b.ang+=b.spd*dt*0.35;
    const px=b.cx+Math.cos(b.ang)*b.r,pz=b.cz+Math.sin(b.ang)*b.r;
    const py=b.h+Math.sin(t*0.7+k)*2;
    b.g.position.set(px,py,pz);
    b.g.rotation.y=-b.ang;
    const fl=Math.sin(t*9+k)*0.55;
    b.w1.rotation.z=fl;b.w2.rotation.z=-fl;
  }
}

function updateMisc(t,dt){
  fallTex.offset.y-=dt*1.4;
  if(fallTex.offset.y<-1)fallTex.offset.y+=1;
  waterMesh.material.opacity=0.78+0.05*Math.sin(t*1.7);
  for(let k=0;k<fragments.length;k++){
    const f=fragments[k];
    f.mesh.position.y=f.y0+Math.sin(t*f.sp+f.ph)*1.4;
    f.mesh.rotation.y+=f.rs*dt;
  }
  fairClouds.children.forEach(b=>{
    b.position.x+=0.8*dt;
    if(b.position.x>130)b.position.x=-130;
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  tNow+=dt;
  const {seas,daylight,alt,phase}=updateSun(tNow);
  updateZones(tNow,dt,seas,daylight,alt,Math.cos(tNow/DAY_LEN*Math.PI*2+0.35));
  updateVolcano(tNow,dt);
  updateAnimals(tNow,dt);
  updateMisc(tNow,dt);
  if(flight){
    const k=Math.min(1,(tNow-flight.t0)/flight.dur);
    const e=k*k*k*(k*(k*6-15)+10);
    camera.position.lerpVectors(flight.p0,flight.p1,e);
    controls.target.lerpVectors(flight.q0,flight.q1,e);
    if(k>=1){flight=null;controls.enabled=true;}
  }
  controls.update();
  hudTimer-=dt;
  if(hudTimer<=0){
    hudTimer=0.25;
    if(seasonNameEl.textContent!==seas.name)seasonNameEl.textContent=seas.name;
    if(dayPhaseEl.textContent!==phase)dayPhaseEl.textContent=phase;
  }
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
