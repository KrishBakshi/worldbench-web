<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aureline — Floating Voxel Isle</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }

  canvas { display: block; }
  #hud {

  #legend .foot {

<body>
<div id="hud">
  <aside id="legend">
    <h1>Aureline Isle</h1>
    <div class="sub">Field survey · tap a region to fly</div>
    <div id="rows"></div>
    <div class="foot">Drag to orbit · scroll to zoom · right-drag to pan<br/>Day, night, and seasons cycle on their own.</div>
  </aside>
  <div id="season"><div class="k">Season</div><div class="v" id="seasonName">Spring</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>

const NX = 92, NZ = 80, BS = 1.15;
const SEASONS = ["Spring", "Summer", "Autumn", "Winter"];
const C = {
  oceanS: 0x3ad4d0, oceanD: 0x17608c, oceanC: 0x2ee0c8, mix: 0x5ad4c8,
  sand: 0xf2e6c4, cream: 0xf7f0d8, tan: 0xd2b07a,
  jung: 0x1e8c38, jungD: 0x0c5a24, jungL: 0x32b44a, mist: 0xb8c4b8,
  swamp: 0x5a6a28, swampD: 0x3a4a18, swampW: 0x243428,
  grass: 0x5a9c38, olive: 0x6b8c34, grassD: 0x3e7a28,
  pink: 0xf08ab8, petal: 0xff9ac8, meadow: 0xe8a8b8, stem: 0x5a9a48,
  high: 0x7a8a66, highR: 0x8a9080, scrub: 0x6a7a58,
  snow: 0xf2f6ff, ice: 0xd8e6f4, rock: 0x6a7382, rockD: 0x4a5362, rockL: 0x8a929c,
  pine: 0x163e2c, pineL: 0x1f5a3a, trunk: 0x5a3820, trunkD: 0x3e2414,
  gold: 0xe0b048, ochre: 0xc48a34, dust: 0xd4b878, sandR: 0xd4a056,
  cactus: 0x3a8c40, cactusD: 0x2a6a30,
  basalt: 0x1a1a20, ash: 0x3a3a40, lava: 0xff4a14, lavaH: 0xffc028, crater: 0x1a0808,
  obsid: 0x0c0818, river: 0x3ad8e6, riverD: 0x2aa8b8,
  dirt: 0x6a4a28, stone: 0x7a7e88, mineral: 0x3aa8ff, glow: 0x1e6aff,
  flowerY: 0xf0dc58, flowerW: 0xf6f4ea, reed: 0x6a7a38,
  cloud: 0xe8eef4, cloudD: 0xc8d0dc,
  palm: 0x3a9a38, white: 0xf8f8f4
};

const seeds = [
  ["mountains", 46, 73, 15],
  ["snowforest", 43, 57, 13],
  ["highlands", 70, 57, 12],
  ["grove", 67, 41, 12.5],
  ["jungle", 23, 47, 16],
  ["swamp", 8, 51, 9],
  ["grass", 42, 28, 16],
  ["desert", 70, 16, 17],
  ["volcano", 18, 15, 12],
  ["beach", 36, 8, 9]
];

const views = {
  overview: { p: [8, 72, -86], t: [2, 8, 6] },
  mountains: { p: [4, 36, 108], t: [2, 22, 62] },
  snowforest: { p: [-8, 34, 18], t: [0, 18, 48] },
  highlands: { p: [92, 36, 28], t: [42, 16, 42] },
  jungle: { p: [-58, 32, 18], t: [-22, 10, 22] },
  swamp: { p: [-62, 22, 62], t: [-38, 6, 28] },
  grass: { p: [6, 28, -28], t: [0, 8, 0] },
  grove: { p: [78, 24, 8], t: [32, 8, 14] },
  desert: { p: [78, 30, -42], t: [36, 8, -18] },
  volcano: { p: [-52, 34, -38], t: [-24, 16, -18] },
  ocean: { p: [-20, 22, -70], t: [-10, 4, -20] }
};

const legend = [
  ["overview", "#c8b890", "Whole island", "high orbit"],
  ["mountains", "#eef2fa", "Snow mountains", "blizzard"],
  ["snowforest", "#1a4a32", "Snowy conifer forest", "snowfall"],
  ["highlands", "#7a8a66", "Temperate highlands", "mist · light rain"],
  ["jungle", "#1e8c38", "Dense jungle", "rain · waterfall"],
  ["swamp", "#5a6a28", "Backwater swamp", "low mist"],
  ["grass", "#5a9c38", "Grassland plateau", "open river plain"],
  ["grove", "#f08ab8", "Flowering grove", "moist basin"],
  ["desert", "#e0b048", "Desert & sandstone", "sandstorm"],
  ["volcano", "#ff4a14", "Volcanic wasteland", "ash · lava"],
  ["ocean", "#3ad4d0", "Coast / ocean", "delta · lagoons"]
];

function fract(n) { return n - Math.floor(n); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(t) { return t * t * (3 - 2 * t); }
function hash(x, z) {
  return fract(Math.sin(x * 127.1 + z * 311.7) * 43758.5453);
}
function noise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  const ux = smooth(fx), uz = smooth(fz);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uz);
}
function fbm(x, z) {
  return noise(x, z) * 0.5 + noise(x * 2.1, z * 2.1) * 0.28 + noise(x * 4.3, z * 4.3) * 0.14;
}
function dist(ax, az, bx, bz) { return Math.hypot(ax - bx, az - bz); }
function idx(x, z) { return z * NX + x; }
function inb(x, z) { return x >= 0 && z >= 0 && x < NX && z < NZ; }
function wx(x) { return (x - NX * 0.5) * BS; }
function wz(z) { return (z - NZ * 0.5) * BS; }
function wy(y) { return y * BS; }

function nearestSeed(x, z) {
  let best = "grass", bd = 1e9;
  for (const [name, sx, sz, r] of seeds) {
    const d = dist(x, z, sx, sz) / r;
    if (d < bd) { bd = d; best = name; }
  }
  return { name: best, d: bd };
}

function landRadius(x, z) {
  const n = fbm(x * 0.05, z * 0.05) * 0.12;
  return nearestSeed(x, z).d + n;
}

function biomeAt(x, z) {
  const lr = landRadius(x, z);
  const west = x < 7 + noise(x * 0.2, z * 0.1) * 2;
  const south = z < 6 + noise(x * 0.15, z * 0.2) * 2.2;
  if (lr > 1.02) {
    if ((west || south) && lr < 1.38) return lr < 1.12 ? "beach" : "ocean";
    return lr < 1.12 && !west && z > 55 ? "cliffvoid" : (lr < 1.22 ? "beach" : "void");
  }
  let b = nearestSeed(x, z).name;
  if ((west || south) && lr > 0.88 && (b === "grass" || b === "desert" || b === "volcano" || b === "jungle")) {
    if (south && z < 10) b = "beach";
    if (west && x < 10 && z < 40) b = "beach";
  }
  return b;
}

const rivers = [
  { pts: [[46,75],[45,70],[44,65],[43,60],[41,56],[36,52],[31,48],[29,44],[31,38],[36,33],[40,28],[38,22],[34,16],[31,11],[29,7]], w: 1.55 },
  { pts: [[20,52],[24,48],[28,44],[31,40]], w: 1.05 },
  { pts: [[18,44],[22,40],[26,36],[30,33]], w: 0.9 },
  { pts: [[70,60],[68,54],[66,48],[65,43],[60,38],[52,34],[44,30]], w: 1.0 },
  { pts: [[50,34],[46,30],[42,26],[40,22]], w: 0.85 },
  { pts: [[28,30],[33,27],[37,24]], w: 0.8 },
  { pts: [[48,26],[44,22],[40,18],[36,14]], w: 0.75 }
];
const washes = [
  { pts: [[74,24],[73,20],[72,16],[71,13],[70,11]], w: 0.9 },
  { pts: [[64,18],[65,14],[66,11]], w: 0.7 }
];
const lavaPaths = [
  { pts: [[18,15],[16,12],[14,10],[13,8]], w: 1.15 },
  { pts: [[18,15],[21,12],[23,10],[24,8]], w: 1.05 },
  { pts: [[18,15],[17,18],[15,20]], w: 0.9 },
  { pts: [[18,15],[20,17],[22,18]], w: 0.85 }
];

function distToPath(x, z, pts) {
  let m = 1e9;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i][0], az = pts[i][1], bx = pts[i+1][0], bz = pts[i+1][1];
    const dx = bx - ax, dz = bz - az;
    const l2 = dx * dx + dz * dz || 1;
    let t = clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1);
    m = Math.min(m, Math.hypot(x - (ax + dx * t), z - (az + dz * t)));
  }
  return m;
}

function heightAt(x, z, b) {
  const n = fbm(x * 0.09, z * 0.09);
  const n2 = fbm(x * 0.2 + 9, z * 0.2);
  let h = 7;
  if (b === "ocean") h = 2 + n * 0.4;
  else if (b === "beach") h = 4 + n * 0.6;
  else if (b === "grass") h = 6.2 + n * 1.1;
  else if (b === "grove") {
    const t = clamp((z - 36) / 18, 0, 1);
    h = lerp(7.0, 11.5, t) + n * 1.1;
  } else if (b === "jungle") h = 8.4 + n * 1.8 + (x > 28 && x < 36 && z > 42 && z < 52 ? 5 : 0);
  else if (b === "swamp") h = 5.2 + n * 0.8;
  else if (b === "highlands") {
    const t = clamp((z - 40) / 22, 0, 1);
    h = lerp(8.2, 16.4, t) + n * 1.6 + n2 * 0.8;
  } else if (b === "snowforest") {
    h = 15.2 + n * 1.8 + clamp((z - 50) * 0.18, 0, 3);
  } else if (b === "mountains") {
    h = 18 + n * 2.4;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 46, 73) / 16), 1.35) * 14;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 38, 76) / 6.5), 2) * 9;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 54, 75) / 6.2), 2) * 10;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 47, 78) / 5), 2) * 7;
  } else if (b === "desert") {
    h = 6.4 + n * 0.9;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 76, 20) / 7.5), 1.8) * 13;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 64, 11) / 6.2), 1.8) * 11;
    h += Math.pow(Math.max(0, 1 - dist(x, z, 80, 14) / 5.5), 2) * 8;
  } else if (b === "volcano") {
    const d = dist(x, z, 18, 15);
    h = 6.5 + Math.pow(Math.max(0, 1 - d / 12.5), 1.15) * 24;
    if (d < 2.2) h -= 4.2;
  } else if (b === "cliffvoid" || b === "void") h = 0;
  return Math.round(h);
}

const biome = new Array(NX * NZ);
const height = new Int8Array(NX * NZ);
const water = new Uint8Array(NX * NZ);
const lava = new Uint8Array(NX * NZ);
const occ = new Uint8Array(NX * NZ);

for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
  const b = biomeAt(x, z);
  biome[idx(x, z)] = b;
  height[idx(x, z)] = heightAt(x, z, b);
}
const islets = [[22, 4], [12, 9], [7, 20], [42, 2], [16, 5], [5, 32]];
for (const [ix, iz] of islets) {
  for (let z = iz - 2; z <= iz + 2; z++) for (let x = ix - 2; x <= ix + 2; x++) {
    if (!inb(x, z)) continue;
    const b = biome[idx(x, z)];
    if (b !== "ocean" && b !== "void" && b !== "cliffvoid") continue;
    if (dist(x, z, ix, iz) < 1.8 + hash(ix, iz) * 0.6) {
      biome[idx(x, z)] = hash(x, z) > 0.35 ? "beach" : "ocean";
      height[idx(x, z)] = biome[idx(x, z)] === "beach" ? 4 : 2;
    }
  }
}

for (const r of rivers) {
  for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
    const b = biome[idx(x, z)];
    if (b === "desert" || b === "volcano" || b === "void" || b === "cliffvoid") continue;
    const d = distToPath(x, z, r.pts);
    if (d < r.w) {
      water[idx(x, z)] = 1;
      height[idx(x, z)] = Math.max(3, height[idx(x, z)] - 1);
    } else if (d < r.w + 1.1 && (b === "grass" || b === "jungle")) {
      if (hash(x, z) > 0.55) {
        water[idx(x, z)] = 1;
        height[idx(x, z)] = Math.max(3, height[idx(x, z)] - 1);
      }
    }
  }
}
for (const r of washes) {
  for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
    if (biome[idx(x, z)] !== "desert") continue;
    if (distToPath(x, z, r.pts) < r.w && hash(x + 3, z) > 0.35) {
      height[idx(x, z)] = Math.max(4, height[idx(x, z)] - 1);
    }
  }
}
for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
  const b = biome[idx(x, z)];
  if (b === "swamp" && fbm(x * 0.18, z * 0.18) < 0.42) {
    water[idx(x, z)] = 2;
    height[idx(x, z)] = Math.min(height[idx(x, z)], 5);
  }
  if (b === "jungle" && dist(x, z, 26, 50) < 2.4) {
    water[idx(x, z)] = 1;
    height[idx(x, z)] = 8;
  }
  if (b === "grove" && distToPath(x, z, [[70,60],[68,54],[66,48],[65,43]]) < 1.1) {
    water[idx(x, z)] = 1;
  }
  if (z < 12 && z > 4 && x > 24 && x < 42 && b !== "desert" && b !== "volcano" && b !== "void") {
    const braid = Math.abs(Math.sin(x * 0.55 + z * 0.3) * 1.6 + (x - 32) * 0.08);
    if (braid < 1.05 && hash(x + 2, z) > 0.28) {
      water[idx(x, z)] = 1;
      height[idx(x, z)] = Math.max(3, height[idx(x, z)] - 1);
    }
  }
  if (dist(x, z, 22, 21) < 2.4 && (b === "volcano" || b === "jungle" || b === "grass")) {
    water[idx(x, z)] = 1;
  }
}
for (const r of lavaPaths) {
  for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
    if (biome[idx(x, z)] !== "volcano") continue;
    if (distToPath(x, z, r.pts) < r.w) lava[idx(x, z)] = 1;
  }
}
for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
  if (biome[idx(x, z)] === "volcano" && dist(x, z, 18, 15) < 3.2 && hash(x, z) > 0.4) lava[idx(x, z)] = 2;
}
for (let z = 1; z < NZ - 1; z++) for (let x = 1; x < NX - 1; x++) {
  if (!water[idx(x, z)]) continue;
  let hit = false;
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    if (lava[idx(x + dx, z + dz)]) hit = true;
  }
  if (hit) { water[idx(x, z)] = 0; lava[idx(x, z)] = 0; biome[idx(x, z)] = "obsidian"; }
}

const buckets = new Map();
function add(col, x, y, z) {
  let a = buckets.get(col);
  if (!a) { a = []; buckets.set(col, a); }
  a.push(wx(x), wy(y), wz(z));
}
function surfCol(b, x, z, y, h) {
  const v = hash(x * 1.7, z * 2.3);
  if (b === "ocean") return y < 2 ? C.oceanD : (v > 0.6 ? C.oceanC : C.oceanS);
  if (b === "beach") return v > 0.66 ? C.cream : (v > 0.33 ? C.sand : C.tan);
  if (b === "grass") return v > 0.7 ? C.olive : (v > 0.35 ? C.grass : C.grassD);
  if (b === "grove") return v > 0.55 ? C.meadow : C.pink;
  if (b === "jungle") return v > 0.6 ? C.jungL : (v > 0.3 ? C.jung : C.jungD);
  if (b === "swamp") return v > 0.5 ? C.swamp : C.swampD;
  if (b === "highlands") return v > 0.55 ? C.highR : (v > 0.25 ? C.high : C.scrub);
  if (b === "snowforest") return y > 16 ? C.snow : (v > 0.5 ? C.rock : C.rockD);
  if (b === "mountains") return y > h - 3 || y > 24 ? C.snow : (y > 18 ? C.ice : (v > 0.5 ? C.rock : C.rockD));
  if (b === "desert") return y > 12 ? C.sandR : (v > 0.6 ? C.gold : (v > 0.3 ? C.ochre : C.dust));
  if (b === "volcano") return v > 0.7 ? C.ash : C.basalt;
  if (b === "obsidian") return C.obsid;
  if (b === "cliffvoid") return C.rockD;
  return C.stone;
}

for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
  const b = biome[idx(x, z)];
  if (b === "void") continue;
  const h = height[idx(x, z)];
  let minN = h;
  const edge = x === 0 || z === 0 || x === NX - 1 || z === NZ - 1;
  for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    if (!inb(x + dx, z + dz) || biome[idx(x + dx, z + dz)] === "void") { minN = -12; continue; }
    minN = Math.min(minN, height[idx(x + dx, z + dz)]);
  }
  const bottom = (edge || minN < h - 1 || b === "ocean" || b === "beach") ? Math.min(minN, -8) - (edge ? 4 : 0) : h - 1;
  const riverTop = water[idx(x, z)] && b !== "ocean";
  const lavaTop = lava[idx(x, z)];
  for (let y = h; y >= Math.max(bottom, -14); y--) {
    if (y < h - 1 && y > minN && !edge && b !== "ocean") continue;
    if ((riverTop || lavaTop) && y === h) continue;
    let col;
    if (y === h) col = surfCol(b, x, z, y, h);
    else if (y > h - 3 && b !== "ocean" && b !== "volcano") col = (b === "beach" || b === "desert") ? C.sand : C.dirt;
    else col = hash(x, y + z * 3) > 0.92 && y < 2 ? C.mineral : (hash(x, y) > 0.5 ? C.stone : C.rockD);
    if (b === "volcano" && y < h) col = hash(x, y) > 0.7 ? C.ash : C.basalt;
    if (b === "mountains" && y > 20) col = C.snow;
    add(col, x, y, z);
  }
  if (water[idx(x, z)]) {
    const wc = water[idx(x, z)] === 2 ? C.swampW : (b === "ocean" || b === "beach" ? C.mix : C.river);
    add(wc, x, h, z);
  }
  if (b === "ocean") {
    add(h <= 2 ? C.oceanD : C.oceanS, x, 3, z);
    if (hash(x * 3.1, z * 2.7) > 0.9) {
      add(C.rockL, x, 3, z);
      add(hash(x, z) > 0.5 ? C.jungL : C.oceanC, x, 4, z);

function makeOrbit(cam, el) {
  const target = new THREE.Vector3(2, 8, 6);
  const sph = new THREE.Spherical();
  const offset = new THREE.Vector3();
  const pan = new THREE.Vector3();
  const sphericalDelta = new THREE.Spherical();
  let scale = 1, damping = 0.12;
  let state = 0, px = 0, py = 0;
  offset.copy(cam.position).sub(target);
  sph.setFromVector3(offset);
  function onDown(e) {
    if (e.button === 0 && !e.ctrlKey && !e.metaKey) state = 1;
    else state = 2;
    px = e.clientX; py = e.clientY;
    el.setPointerCapture(e.pointerId);
  }
  function onMove(e) {
    if (!state) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY;
    if (state === 1) {
      sphericalDelta.theta -= dx * 0.005;
      sphericalDelta.phi -= dy * 0.005;
    } else {
      const dist = cam.position.distanceTo(target);
      const x = dx * dist * 0.0012, y = dy * dist * 0.0012;
      pan.setFromMatrixColumn(cam.matrix, 0).multiplyScalar(-x);
      pan.addScaledVector(new THREE.Vector3().setFromMatrixColumn(cam.matrix, 1), y);
      target.add(pan);
    }
  }
  function onUp() { state = 0; }
  function onWheel(e) {
    e.preventDefault();
    scale *= Math.exp(e.deltaY * 0.0012);
  }
  el.addEventListener("pointerdown", onDown);
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", onUp);
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("wheel", onWheel, { passive: false });
  return {
    target,
    update() {
      offset.copy(cam.position).sub(target);
      sph.setFromVector3(offset);
      sph.theta += sphericalDelta.theta;
      sph.phi += sphericalDelta.phi;
      sph.phi = clamp(sph.phi, 0.08, Math.PI - 0.08);
      sph.radius = clamp(sph.radius * scale, 8, 160);
      sphericalDelta.theta *= (1 - damping);
      sphericalDelta.phi *= (1 - damping);
      scale += (1 - scale) * damping;
      offset.setFromSpherical(sph);
      cam.position.copy(target).add(offset);
      cam.lookAt(target);
    }
  };
}

  const sName = SEASONS[sIdx];
  document.getElementById("seasonName").textContent = sName;
  const warm = sIdx === 1 ? 1 : sIdx === 0 ? 0.7 : sIdx === 2 ? 0.5 : 0.15;
  const snowMul = sIdx === 3 ? 1.35 : sIdx === 0 ? 0.55 : 0.2;
  const rainMul = sIdx === 0 ? 1.15 : sIdx === 1 ? 1.05 : sIdx === 2 ? 0.7 : 0.35;

  const sunCol = new THREE.Color().setHSL(0.09 + warm * 0.02, 0.45, 0.72 + dayN * 0.1);
  if (dusk > 0.2) sunCol.lerp(new THREE.Color(0xff7a3a), dusk * 0.7);
  sunLight.color.copy(sunCol);
  sunLight.intensity = lerp(0.08, 1.25, dayN) * (0.85 + warm * 0.2);
  ambient.intensity = lerp(0.07, 0.48, dayN);
  ambient.color.set(sIdx === 3 ? 0xa8c0d8 : (sIdx === 2 ? 0xe0c8a8 : 0xd8e0f0));
  sunMesh.material.color.set(dayN > 0.05 ? sunCol : 0x8899bb);
  sunMesh.visible = sunY > -12;
  lavaLight.intensity = 1.6 + Math.sin(time * 2.2) * 0.8;

  const stormCool = burst(time, 18, 0) * 0.2;
  if (stormCool > 0) sunLight.intensity *= 1 - stormCool;

  const jR = burst(time, 16, 0.1) * rainMul;
  const hR = burst(time, 22, 0.6) * rainMul * 0.7;
  const sN = burst(time, 14, 0.3) * snowMul;
  const bL = burst(time, 11, 0.05) * (0.7 + snowMul * 0.5);
  const dS = burst(time, 17, 0.8);
  const aS = burst(time, 9, 0.2);
  const mI = burst(time, 20, 0.4) * 0.8;
  const eV = burst(time, 15, 0.5) * dayN * (sIdx === 1 ? 1 : 0.5);

  weatherBox(rainJ, 900, jR, wx(23), 20, wz(47), 28, 18, 24, 0.1, -1, 0, time, false);
  weatherBox(rainH, 400, hR, wx(70), 24, wz(56), 16, 12, 14, 0, -1, 0, time, false);
  weatherBox(snowF, 700, sN, wx(43), 26, wz(57), 22, 10, 16, 0.05, -0.5, 0, time, false);
  weatherBox(bliz, 1100, bL, wx(46), 30, wz(82), 36, 16, 14, 1.4, 0, 0.35, time, true);
  weatherBox(sand, 800, dS, wx(70), 12, wz(16), 30, 10, 24, 1.1, 0.1, 0.2, time, true);
  weatherBox(ashP, 500, aS, wx(18), 32, wz(15), 10, 18, 10, 0.15, -0.2, 0.1, time, false);
  weatherBox(mistP, 350, mI, wx(8), 8, wz(51), 14, 6, 12, 0, 0.15, 0, time, false);
  weatherBox(evap, 280, eV, wx(40), 9, wz(28), 24, 8, 20, 0, 0.35, 0, time, false);

  lavaLight.position.y = wy(26) + Math.sin(time * 3) * 0.4;
  if (aS > 0.85 && Math.sin(time * 9) > 0.92) lavaLight.intensity = 6;

  clouds[0].position.x = wx(43) + Math.sin(time * 0.07) * 2;
  clouds[1].position.x = wx(23) + Math.cos(time * 0.05) * 2.5;
  clouds[2].position.z = wz(56) + Math.sin(time * 0.06) * 1.5;
  clouds.forEach(c => { c.children.forEach((ch, i) => { ch.material.opacity = 0.55 + 0.3 * (1 - dayN * 0.3); }); });

  for (const f of fauna) {
    f.userData.t += dt * f.userData.spd;
    const ud = f.userData;
    if (ud.kind === "fish") {
      f.position.x += Math.cos(ud.t) * dt * 0.6;
      f.position.z += Math.sin(ud.t * 0.8) * dt * 0.5;
      f.position.y += Math.sin(ud.t * 2) * dt * 0.15;
      f.rotation.y = Math.atan2(Math.cos(ud.t), Math.sin(ud.t * 0.8));
    } else {
      const nx = f.position.x + Math.cos(ud.yaw) * dt * 1.1;
      const nz = f.position.z + Math.sin(ud.yaw) * dt * 1.1;
      const gx = Math.round(nx / BS + NX * 0.5);
      const gz = Math.round(nz / BS + NZ * 0.5);
      if (inb(gx, gz) && ud.names.includes(biome[idx(gx, gz)]) && !lava[idx(gx, gz)]) {
        f.position.x = nx;
        f.position.z = nz;
        f.position.y = wy(height[idx(gx, gz)] + 1) + (ud.kind === "deer" ? 0 : 0);
      } else ud.yaw += 0.8;
      if (Math.random() < 0.01) ud.yaw += (Math.random() - 0.5) * 1.2;
      f.rotation.y = -ud.yaw + Math.PI / 2;
      f.position.y += Math.sin(ud.t * 6) * 0.004;
    }
  }

  if (fly) {
    fly.t += dt / 1.45;
    const u = smooth(clamp(fly.t, 0, 1));
    camera.position.lerpVectors(fly.p0, fly.p1, u);
    controls.target.lerpVectors(fly.t0, fly.t1, u);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
